spring.application.name=notificaciones
server.port=${PORT:8082}
spring.data.mongodb.uri=${NOT_URI}

# CloudAMQP
spring.rabbitmq.addresses=${CLOUDAMQP_URL}

# URL de MicroUsuario (en Render apunta a la URL publica)
micro.usuario.url=${MICRO_USUARIO_URL}

# ========== RABBITMQ LISTENER - ACK MANUAL + RETRY + DLQ ==========
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=10
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=2000
spring.rabbitmq.listener.simple.retry.max-interval=10000
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# ========== KAFKA (AIVEN CLOUD) ==========
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.security.protocol=SASL_SSL
spring.kafka.sasl.mechanism=PLAIN
spring.kafka.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_USERNAME}" password="${KAFKA_PASSWORD}";
spring.kafka.ssl.trust-store-location=classpath:ca.pem
spring.kafka.ssl.trust-store-type=PEM

# Serializadores
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.group-id=notificaciones-group
spring.kafka.consumer.auto-offset-reset=earliest