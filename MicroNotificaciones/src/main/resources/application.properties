spring.application.name=notificaciones
server.port=${PORT:8082}
spring.data.mongodb.uri=${NOT_URI}

# CloudAMQP
spring.rabbitmq.addresses=${CLOUDAMQP_URL}

# URL de MicroUsuario (en Render apunta a la URL publica)
micro.usuario.url=${MICRO_USUARIO_URL}

# URL para logs
betterstack.token=${LOGTAIL_SOURCE_TOKEN:}

# ========== RABBITMQ LISTENER - ACK MANUAL + RETRY + DLQ ==========
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=10
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=2000
spring.rabbitmq.listener.simple.retry.max-interval=10000
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.default-requeue-rejected=false